# Portfolio manifest for a stabilization workspace.
# Fill every field. Use `unknown` where evidence is missing — never guess.
# Seed the repository list from evidence/inventory.json, then complete by hand.

portfolio_revision: unknown           # e.g. 2026-08-23 snapshot label
assessment_date: unknown
production_telemetry_available: unknown   # yes | no | partial

repositories:
  - id: orders-api
    path: /abs/path/or/canonical/url
    sha: unknown                      # pinned commit SHA
    default_branch: unknown
    build_system: unknown             # java/maven, javascript/nx, javascript/angular, javascript/npm, javascript/webpack, javascript/module-federation, ...
    tech_stack: []                    # e.g. angularjs-1.x, angular-17, nx-17.3, react-19, module-federation, spring-boot-2.7, spring-boot-3.5, hibernate, java-21, maven-3.8, oracle-19c, alloydb, solr-9, redis-7.2
    deployables: []                   # services, web apps, MFE host/remotes, jobs, migration projects
    database_schemas: []              # Oracle / AlloyDB schemas this repo touches
    search_collections: []            # SOLR cores/collections this repo queries or indexes
    cache_namespaces: []              # Redis key prefixes / logical caches this repo uses
    upstream_dependencies: []         # repos/services it calls
    downstream_dependencies: []       # repos/services that call it
    production_criticality: unknown   # high | medium | low
    owner: unknown
